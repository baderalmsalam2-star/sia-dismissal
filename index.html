<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d3160">
  <title>نداء الانصراف</title>
  <!-- الأيقونات تحمل ?v= مثل بقية الملفات، وإلا خدم المتصفح الأيقونة القديمة من ذاكرته -->
  <link rel="icon" href="assets/favicon-32.png?v=20" sizes="32x32">
  <link rel="icon" href="assets/icon-192.png?v=20" sizes="192x192">
  <!-- أيقونة الشاشة الرئيسية: شعار المدرسة، والاسم "انصراف" -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20">
  <meta name="apple-mobile-web-app-title" content="انصراف">
  <meta name="application-name" content="انصراف">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- لا تضف <link rel="manifest">: عند الإضافة للشاشة الرئيسية يفتح iOS رابط start_url
       ويرمي رمز المدرسة الموجود في الـ hash، فيبدأ التطبيق فاضيًا. أيقونة الشعار
       واسم "انصراف" يكفيهما وسوم apple-* أعلاه على iOS و Android. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- غيّر رقم v عند كل تحديث حتى تحمّل الأجهزة النسخة الجديدة -->
  <link rel="stylesheet" href="app.css?v=20">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=20"></script>
  <script src="seed.js" onerror="void 0"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
