<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d3160">
  <title>نداء الانصراف</title>
  <!-- الأيقونات تحمل ?v= مثل بقية الملفات، وإلا خدم المتصفح الأيقونة القديمة من ذاكرته -->
  <link rel="icon" href="assets/favicon-32.png?v=34" sizes="32x32">
  <link rel="icon" href="assets/icon-192.png?v=34" sizes="192x192">
  <!-- أيقونة الشاشة الرئيسية: شعار المدرسة، والاسم "انصراف" -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=34">
  <meta name="apple-mobile-web-app-title" content="انصراف">
  <meta name="application-name" content="انصراف">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- لا تضف <link rel="manifest">: عند الإضافة للشاشة الرئيسية يفتح iOS رابط start_url
       ويرمي رمز المدرسة الموجود في الـ hash، فيبدأ التطبيق فاضيًا. أيقونة الشعار
       واسم "انصراف" يكفيهما وسوم apple-* أعلاه على iOS و Android. -->
  <!-- كل شيء من هذا الموقع، ولا اتصال إلا بقاعدة البيانات. لو انحقن سطر في
       اسم طالب أو في رابط خريطة، فلا سكربت خارجي ينفّذه ولا وجهة يُرسل إليها شيء.
       المتصفح القديم يتجاهل هذا السطر فلا يتأثر العرض. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com; base-uri 'none'; form-action 'none'">
  <!-- الخط مستضاف داخل assets/ في app.css — لا مورد خارجي يحجب العرض -->
  <!-- غيّر رقم v عند كل تحديث حتى تحمّل الأجهزة النسخة الجديدة -->
  <link rel="stylesheet" href="app.css?v=34">
</head>
<body>
  <!-- هذه الرسالة تُمسح فور اشتغال app.js، وتظهر بعد أربع ثوانٍ فقط إذا ما اشتغل
       (متصفح تلفزيون قديم لا يفهم جافاسكربت الحديثة) بدل شاشة بيضاء صامتة -->
  <div id="app"><div class="boot-note">
    <strong>ما قدر التطبيق يشتغل على هذا المتصفح.</strong>
    <span>جرّب متصفحًا أحدث، أو اعرض الشاشة من جوال أو لابتوب على التلفزيون.</span>
  </div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=34"></script>
  <!-- seed.js غير موجود في المستودع عمدًا؛ غيابه يظهر كخطأ 404 في السجل فقط -->
  <script src="seed.js"></script>
  <script src="app.js?v=34"></script>
</body>
</html>
